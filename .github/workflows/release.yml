name: release

# Tagging is the release. `just release 0.2.0` writes the version, commits,
# and pushes the tag; everything below is what happens next.
on:
  push:
    tags: ["v*"]
  # Runnable by hand against a tag, for when a release job fails on
  # something unrelated to the code and needs rerunning.
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # A tag that disagrees with Cargo.toml produces binaries reporting a
  # version nobody can find. Cheaper to refuse here than to yank later.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$manifest" ]; then
            echo "::error::tag $tag says $tag_version, Cargo.toml says $manifest"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  # The same gate `just check` runs, on the exact commit being released.
  # ci.yml also runs on the tag push; this makes the dependency explicit so a
  # release cannot be published from a red commit.
  check:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: [verify, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Cross-compiled from Apple Silicon rather than asking for an
          # Intel runner: macos-13 is being retired and the first release
          # sat queued forever with no runner ever assigned. Xcode on
          # macos-14 ships both SDKs, so this needs no extra setup.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Not the action's `targets:` input, which installs into the toolchain
      # the action selects -- while rust-toolchain.toml pins 1.97 for anything
      # run inside the checkout, so cargo never sees that target and fails with
      # "can't find crate for `core`". Run inside the repo, rustup honours the
      # toolchain file, so this installs against the toolchain that builds.
      # A no-op for the three host targets; the only one it matters for is the
      # single genuine cross-compile, x86_64-apple-darwin.
      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build binaries
        # `--bins` applies to the whole invocation; repeating it per package
        # is rejected by cargo. Verified locally before this was committed.
        run: cargo build --release --target ${{ matrix.target }} -p kineto -p kineto-asciicast --bins

      # `--help` proves the binary links and runs, which a successful compile
      # does not. Only possible when the target matches the runner's own
      # architecture — a cross-compiled binary cannot be executed here, and
      # depending on Rosetta being present would trade a real check for a
      # flaky one.
      - name: Smoke test
        if: ${{ (startsWith(matrix.target, 'aarch64') && runner.arch == 'ARM64') || (startsWith(matrix.target, 'x86_64') && runner.arch == 'X64') }}
        run: ./target/${{ matrix.target }}/release/kineto --help

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          name="kineto-v${v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/kineto \
             target/${{ matrix.target }}/release/kineto-mcp \
             target/${{ matrix.target }}/release/kineto-cast "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checksums are per-artifact so they can be verified without
          # downloading every platform's build.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          {
            echo "## Install"
            echo
            echo 'Download the archive for your platform below, then:'
            echo
            echo '```sh'
            echo 'tar xzf kineto-v'"$v"'-<target>.tar.gz'
            echo 'sudo mv kineto-v'"$v"'-<target>/kineto* /usr/local/bin/'
            echo 'claude mcp add --scope user kineto /usr/local/bin/kineto-mcp'
            echo '```'
            echo
            echo 'Three binaries: `kineto` (render a document), `kineto-mcp`'
            echo '(the MCP server), `kineto-cast` (asciicast → video).'
            echo
            echo 'ffmpeg is required for encoding only — frames render without it.'
            echo
            echo '### Verify'
            echo
            echo '```sh'
            echo 'shasum -a 256 -c kineto-v'"$v"'-<target>.tar.gz.sha256'
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: kineto v${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # crates.io publishing is irreversible: a name can never be freed and a
  # version can only be yanked, never replaced. So this runs last, only after
  # the binaries are built and the GitHub release exists -- if anything above
  # is going to fail, it fails before anything permanent happens.
  #
  # Order is a dependency order, not a preference: kineto-core must be on
  # crates.io before kineto-asciicast, and both before kineto, or resolution
  # fails. `cargo publish` waits for the index by default.
  #
  # kineto-wasm is publish = false (a cdylib consumed through wasm-pack).
  crates-io:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # --workspace, not a loop over -p. Publishing one crate at a time
      # cannot work for a first release: verifying kineto-asciicast resolves
      # kineto-core from the registry, where it does not exist yet, and the
      # command fails before anything is published. --workspace publishes in
      # dependency order and resolves the crates against each other.
      # Verified locally with `cargo package --workspace`, which performs the
      # same packaging and compile-from-tarball for all three.
      #
      # --exclude is belt-and-braces: `publish = false` already keeps
      # kineto-wasm out, but this is an irreversible operation.
      # crates.io rejects republishing a version, so without this check a
      # failure anywhere later in the release -- npm, say -- could only be
      # retried by burning a new version number. Skipping lets the same tag be
      # re-run until every registry has it.
      - id: state
        name: Already published?
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          # crates.io answers 403 to a request without a descriptive
          # User-Agent, which would read as "not published" and defeat the
          # check entirely.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: kineto-release (github.com/DanielFidalgo/kineto)' \
            "https://crates.io/api/v1/crates/kineto/$v")
          if [ "$code" != "200" ] && [ "$code" != "404" ]; then
            echo "::error::unexpected $code from crates.io; refusing to guess"
            exit 1
          fi
          if [ "$code" = "200" ]; then
            echo "kineto $v is already on crates.io; skipping"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run
        if: steps.state.outputs.done == 'false'
        run: cargo publish --workspace --exclude kineto-wasm --dry-run

      - name: Publish
        if: steps.state.outputs.done == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --exclude kineto-wasm

  # npm gets the *same* binaries the release archives contain, repackaged --
  # never a second build, which could differ from what users checksum.
  #
  # Like crates-io, this runs only after the GitHub release exists, and npm is
  # less forgiving still: unpublishing is allowed for 72 hours and the name
  # stays taken regardless.
  npm:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes an .npmrc pointing at the public registry and reading
          # NODE_AUTH_TOKEN, so no credential is ever committed or persisted.
          registry-url: "https://registry.npmjs.org"

      # The dry run below never authenticates, so it cannot tell a good token
      # from a useless one -- the first release failed with a bare 403 partway
      # through publishing. This asks the registry who we are before building
      # anything, and prints the account, which is the fact you actually need
      # when more than one npm identity is in play.
      - name: Check the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/whoami.json -w '%{http_code}' \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            https://registry.npmjs.org/-/whoami)
          if [ "$code" != "200" ]; then
            echo "::error::NPM_TOKEN did not authenticate (HTTP $code)."
            exit 1
          fi
          echo "publishing as: $(jq -r .username /tmp/whoami.json)"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build platform packages
        run: |
          node packages/mcp/build-platforms.mjs \
            --version "${{ needs.verify.outputs.version }}" \
            --from dist --out dist/npm

      # The wrapper pins its four platform packages by exact version, so it is
      # unusable until they exist. Dry-run everything first, then publish
      # platforms before the wrapper.
      - name: Dry run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for d in dist/npm/*/; do npm publish --dry-run "./$d"; done
          # ./ is load-bearing. `npm publish packages/mcp` reads a bare
          # two-segment argument as a GitHub shorthand and tries to clone
          # github.com/packages/mcp; the platform dirs escaped it only because
          # they have three segments and a trailing slash.
          npm publish --dry-run ./packages/mcp

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # A bare npm 403 does not say which of several very different things
          # went wrong, and the preflight cannot tell them apart either -- a
          # token can authenticate perfectly and still have no authority here.
          publish() {
            if ! npm publish "$1"; then
              echo "::error::publish of $1 failed. A 403 'you may not perform \
          that action with these credentials' means the token authenticated but \
          cannot create this package. These names are UNSCOPED, so a token \
          limited to an organisation does not cover them -- an org-scoped token \
          only grants @org/*. It also cannot be limited to selected packages on \
          a first release, because the packages do not exist yet. Use read+write \
          on all packages once, then narrow it to the kineto-mcp* names."
              exit 1
            fi
          }
          for d in dist/npm/*/; do
            echo "::group::$d"
            publish "./$d"
            echo "::endgroup::"
          done
          # Last: a wrapper on the registry whose dependencies are not yet
          # there is an install that fails for whoever hits that window.
          publish ./packages/mcp
