name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable   # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p zoetrope-asciicast --bin zoetrope-cast -- adapters/asciicast/tests/fixture.cast -o target/cast-demo
      - run: test -f target/cast-demo/frame-00000.png

  # Product-defining gate (spec §1/§6): native and wasm must render the
  # golden corpus byte-identically. See tests/parity/run.mjs and
  # crates/core/src/bin/dump-parity.rs.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo install wasm-pack
      # Honest size build first (no corpus feature, which would inflate
      # it) — logged so the wasm size budget (spec §8, < 3 MB gzipped) is
      # visible in CI output.
      - run: wasm-pack build crates/wasm --target web --release
      - run: gzip -k -9 crates/wasm/pkg/zoetrope_wasm_bg.wasm && ls -l crates/wasm/pkg/zoetrope_wasm_bg.wasm.gz
      - run: wasm-pack build crates/wasm --target web --release -- --features corpus
      - run: cargo run -p zoetrope-core --bin dump-parity --features parity
      - run: node tests/parity/run.mjs

  # Task 19: render()'s in-browser WebCodecs + mp4-muxer export, exercised
  # end-to-end in a real (headless) Chromium against the wasm engine — see
  # packages/sdk/test-browser/render.spec.ts.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo install wasm-pack
      # The SDK imports crates/wasm/pkg by relative path (Task 15/17) —
      # build it before anything that touches @zoetrope/sdk.
      - run: wasm-pack build crates/wasm --target web --release
      - run: npm ci
      - run: npm -ws run typecheck --if-present
      - run: npm -ws run test --if-present
      - run: npx playwright install --with-deps chromium
      - run: npm -w @zoetrope/sdk run test:browser
