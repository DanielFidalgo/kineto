name: pages

# The browser half of Kineto was unverifiable by anyone who had not cloned the
# repo and built wasm by hand. The parity gate spends 27 golden hashes proving
# the wasm engine is byte-identical to the native one; nobody could see it run.
#
# This deploys the playground: the pitch is "you write a document; it compiles
# to a video", so the demo lets you write one.

on:
  push:
    branches: [main]
    # The demo is the SDK plus the wasm engine plus its own source. Anything
    # else changing cannot alter what is deployed, and rebuilding wasm on a
    # README edit wastes several minutes for an identical artifact.
    paths:
      - "crates/**"
      - "packages/sdk/**"
      - "packages/playground/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in flight is never worth cancelling half-done, but queued ones are
# superseded by whatever landed after them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: cargo install wasm-pack
      # The SDK imports crates/wasm/pkg by relative path, so this has to exist
      # before anything touching @kineto/sdk is built.
      - run: wasm-pack build crates/wasm --target web --release

      - run: npm ci
      - run: npm -w @kineto/playground run build

      # The same suite CI runs, against the built site rather than the dev
      # server — it exports a real MP4 and checks the ftyp header. Deploying a
      # demo whose one button does nothing would be worse than not deploying.
      - run: npx playwright install --with-deps chromium
      - run: npm -w @kineto/playground run test:browser:dist

      # AFTER every build. `vite build` empties dist, and test:browser:dist
      # runs one — so generating these earlier wrote them and then deleted
      # them, uploading a site with no release pages at all. Nothing below
      # this step may rebuild.
      #
      # GitHub serves release assets as downloads, so a video can only be
      # linked from a release page, never played on one; Pages serves the same
      # bytes with real content types.
      - name: Build the release pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/playground/scripts/build-release-pages.mjs

      # The generator is deliberately non-fatal — a rate limit must not fail a
      # deploy whose point is the playground — so nothing else would notice an
      # empty upload. This says out loud what is about to be published.
      - name: Show what is being deployed
        run: |
          set -euo pipefail
          test -f packages/playground/dist/index.html \
            || { echo "::error::the playground itself is missing from dist"; exit 1; }
          if [ -d packages/playground/dist/releases ]; then
            echo "release pages: $(ls packages/playground/dist/releases | tr '\n' ' ')"
          else
            echo "::warning::no release pages in this deploy"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
