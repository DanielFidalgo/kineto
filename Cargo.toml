[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/mcp", "adapters/asciicast"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DanielFidalgo/kineto"
homepage = "https://github.com/DanielFidalgo/kineto"
keywords = ["video", "mp4", "render", "deterministic", "mcp"]
categories = ["multimedia::video", "command-line-utilities"]

# Path dependencies need a version to be publishable, and crates.io resolves
# against the version while a local build uses the path. Declared once here
# rather than inline per member: `just release` bumps a single line, and
# tests/manifest.rs fails if these drift from workspace.package.version.
[workspace.dependencies]
kineto-core = { path = "crates/core", version = "0.1.2" }
kineto-asciicast = { path = "adapters/asciicast", version = "0.1.2" }

[profile.release]
lto = true
# NOTE: never add any fast-math-style codegen flags (spec §5).
